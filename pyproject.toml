[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxdock"
dynamic = ["version"]
description = "Save what matters. Recall anywhere."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CtxDock contributors"}]
keywords = ["agent-skill", "memory", "codex", "sqlite", "fts5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/TheLastAdmiraL/CtxDock"
Repository = "https://github.com/TheLastAdmiraL/CtxDock.git"
Issues = "https://github.com/TheLastAdmiraL/CtxDock/issues"
Changelog = "https://github.com/TheLastAdmiraL/CtxDock/blob/main/CHANGELOG.md"

[project.scripts]
ctxdock = "ctxdock.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ctxdock.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctxdock = ["_skill/**/*"]

[tool.unittest]
start-directory = "tests"

